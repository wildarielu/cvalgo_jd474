[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wildarielu-cvalgo_jd474"
version = "0.1.0"
description = "把候选项映射到类别上，算出计算机视觉算法工程师·模型热切换的一致性的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "wildarielu" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://wildarielu.github.io"
Repository = "https://github.com/wildarielu/cvalgo_jd474"
Issues = "https://github.com/wildarielu/cvalgo_jd474/issues"

[project.scripts]
cvalgo_jd474 = "cvalgo_jd474:main"

[tool.setuptools]
py-modules = ["cvalgo_jd474"]
